[project]
name = "impossiblev2"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "inspect-ai>=0.3.260",
    "inspect-scout>=0.4.46",
    "matplotlib>=3.11.1",
    "openai>=3.3.1",
    "vllm>=0.27.1; sys_platform == 'linux'",
]

# Installs the repo editable so `common` is importable from every task
# directory. Inspect puts the task file's directory on the path, not the repo
# root, so without this `from common...` only works with PYTHONPATH set.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["common"]
