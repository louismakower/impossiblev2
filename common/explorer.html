<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer</title>
<style>
:root {
  color-scheme: light;
  --surface: #fcfcfb;
  --surface-2: #f4f3f0;
  --ink: #0b0b0b;
  --ink-muted: #52514e;
  --grid: #e6e5e1;
  --band-0: #2a78d6;
  --band-1: #eb6834;
  --band-2: #1baf7a;
  --band-3: #eda100;
  --ord-0: #86b6ef;
  --ord-1: #2a78d6;
  --ord-2: #104281;
  --pass: #1baf7a;
  --warn: #eb6834;
  --fail: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --surface: #1a1a19;
    --surface-2: #232322;
    --ink: #ffffff;
    --ink-muted: #c3c2b7;
    --grid: #383835;
    --band-0: #3987e5;
    --band-1: #d95926;
    --band-2: #199e70;
    --band-3: #c98500;
    --ord-0: #184f95;
    --ord-1: #3987e5;
    --ord-2: #9ec5f4;
    --pass: #199e70;
    --warn: #d95926;
    --fail: #e66767;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 24px 28px 64px;
  background: var(--surface);
  color: var(--ink);
  font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
h2 { font-size: 15px; font-weight: 600; margin: 0 0 10px; }
.subtitle { color: var(--ink-muted); margin: 0 0 22px; }
.switcher { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
.switcher button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); }
.panels { display: flex; flex-wrap: wrap; gap: 28px; }
.panel-title { font-size: 13px; font-weight: 600; margin: 0 0 6px; }
svg { overflow: visible; }
.seg { cursor: pointer; transition: opacity .12s; }
.seg:hover, .seg:focus-visible { opacity: .82; outline: none; }
.seg[data-selected="true"] { stroke: var(--ink); stroke-width: 2px; }
.axis, .tick { fill: var(--ink-muted); font-size: 11px; }
.group-label { fill: var(--ink); font-size: 12px; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.count { fill: var(--surface); font-size: 11px; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 18px; margin: 18px 0 0; color: var(--ink-muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.swatch { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
.controls { margin: 20px 0 0; }
button {
  font: inherit; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--grid); border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
#tooltip {
  position: fixed; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-2); border: 1px solid var(--grid); border-radius: 6px;
  padding: 7px 10px; font-size: 12px; color: var(--ink-muted); max-width: 260px;
  box-shadow: 0 2px 10px rgba(0,0,0,.12);
}
#tooltip b { color: var(--ink); font-size: 15px; }
#detail { margin-top: 30px; border-top: 1px solid var(--grid); padding-top: 18px; }
.hint { color: var(--ink-muted); }
.card { border: 1px solid var(--grid); border-radius: 8px; margin: 0 0 14px; overflow: hidden; }
.card > header {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: baseline;
  padding: 10px 14px; background: var(--surface-2);
}
.card h3 { font-size: 14px; font-weight: 600; margin: 0; }
.badge { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid currentColor; }
.badge.pass { color: var(--pass); }
.badge.fail { color: var(--fail); }
.meta { color: var(--ink-muted); font-size: 12px; }
details { border-top: 1px solid var(--grid); }
summary { cursor: pointer; padding: 8px 14px; color: var(--ink-muted); }
summary::marker { color: var(--grid); }
pre {
  margin: 0; padding: 12px 14px; background: var(--surface-2); color: var(--ink);
  font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap; word-break: break-word; max-height: 420px; overflow: auto;
}
table { border-collapse: collapse; margin-top: 14px; font-size: 13px; }
th, td { border-bottom: 1px solid var(--grid); padding: 6px 12px; text-align: left; }
th { color: var(--ink-muted); font-weight: 600; }
td.num { text-align: right; font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<h1 id="title"></h1>
<p class="subtitle" id="subtitle"></p>

<nav class="switcher" id="switcher" aria-label="Chart"></nav>

<div class="panels" id="panels"></div>
<div class="legend" id="legend"></div>

<div class="controls">
  <button id="toggle-table" aria-expanded="false">Show table</button>
</div>
<div id="table-view" hidden></div>

<section id="detail">
  <p class="hint">Select a bar segment to see its samples.</p>
</section>

<div id="tooltip" role="status" aria-live="polite"></div>

<script type="application/json" id="data">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
document.title = `${DATA.name} explorer`;
const MODELS = [...new Set(DATA.samples.map(s => s.model))].sort();
const GRADINGS = DATA.gradings.filter(s => DATA.samples.some(x => x.grading === s));
const CONTEXTS = DATA.contexts.filter(c => DATA.samples.some(x => x.context === c));

// The chart currently shown: which scanner the bars are split by. `BANDS` is
// that chart's band order, and everything below reads it.
let CHART = DATA.charts[0];
let BANDS = CHART.bands;
// A chart names one colour per band, or a scale: an ordered one gets one hue
// light-to-dark, an unordered one the categorical slots in their fixed order.
const bandColour = i => Array.isArray(CHART.palette)
  ? CHART.palette[i]
  : CHART.palette === "ordinal"
    ? `var(--ord-${i % 3})`
    : `var(--band-${i % 4})`;

// The band a sample falls in: one scorer's value when the chart names a
// scorer, else a scanner's value, or one field of it when the scanner
// answers a structured object.
function bandOf(sample) {
  if (CHART.scorer) return sample.scores.find(s => s.scorer === CHART.scorer)?.value ?? null;
  const result = sample.scanners[CHART.scanner];
  if (!result) return null;
  return CHART.field ? result.value?.[CHART.field] : result.value;
}
const cellSamples = (model, grading, context, band) => DATA.samples.filter(s =>
  s.model === model && s.grading === grading && s.context === context && bandOf(s) === band);

const MAX = Math.max(...MODELS.flatMap(m => GRADINGS.flatMap(s => CONTEXTS.map(c =>
  DATA.samples.filter(x => x.model === m && x.grading === s && x.context === c).length))));

const BAR = 40, PAIR_GAP = 6, GROUP_GAP = 34, PLOT_H = 300;
const M = { top: 8, right: 12, bottom: 46, left: 30 };
const groupWidth = CONTEXTS.length * BAR + (CONTEXTS.length - 1) * PAIR_GAP;

const el = (tag, attrs = {}, text) => {
  const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
  if (text !== undefined) node.textContent = text;   // labels are model output
  return node;
};

function drawPanel(model) {
  const width = M.left + GRADINGS.length * groupWidth
    + (GRADINGS.length - 1) * GROUP_GAP + M.right;
  const svg = el("svg", { width, height: M.top + PLOT_H + M.bottom, role: "img",
    "aria-label": `${CHART.title} ${model}` });
  const y = v => M.top + PLOT_H - (v / MAX) * PLOT_H;

  for (let v = 0; v <= MAX; v++) {
    svg.append(el("line", { class: "gridline", x1: M.left, x2: width - M.right, y1: y(v), y2: y(v) }));
    svg.append(el("text", { class: "tick", x: M.left - 8, y: y(v) + 4, "text-anchor": "end" }, String(v)));
  }

  GRADINGS.forEach((grading, g) => {
    const groupX = M.left + g * (groupWidth + GROUP_GAP);
    CONTEXTS.forEach((context, c) => {
      const x = groupX + c * (BAR + PAIR_GAP);
      let bottom = 0;
      BANDS.forEach((band, i) => {
        const n = cellSamples(model, grading, context, band.key).length;
        if (n) {
          const rect = el("rect", {
            class: "seg", x, width: BAR, y: y(bottom + n), height: y(bottom) - y(bottom + n),
            fill: bandColour(i), stroke: "var(--surface)", "stroke-width": 2,
            tabindex: 0, role: "button",
            "aria-label": `${n} ${band.label}, ${grading} ${context}, ${model}`,
          });
          rect.dataset.cell = JSON.stringify([model, grading, context, band.key]);
          svg.append(rect);
          svg.append(el("text", { class: "count", x: x + BAR / 2,
            y: (y(bottom) + y(bottom + n)) / 2 + 4, "text-anchor": "middle" }, String(n)));
        }
        bottom += n;
      });
      svg.append(el("text", { class: "tick", x: x + BAR / 2, y: M.top + PLOT_H + 16,
        "text-anchor": "middle" }, context));
    });
    svg.append(el("text", { class: "group-label", x: groupX + groupWidth / 2,
      y: M.top + PLOT_H + 36, "text-anchor": "middle" }, grading));
  });

  const wrap = document.createElement("div");
  const heading = document.createElement("p");
  heading.className = "panel-title";
  heading.textContent = model;
  wrap.append(heading, svg);
  return wrap;
}

const tooltip = document.getElementById("tooltip");
function showTooltip(rect, event) {
  const [model, grading, context, band] = JSON.parse(rect.dataset.cell);
  const n = cellSamples(model, grading, context, band).length;
  const label = BANDS.find(b => b.key === band).label;
  tooltip.replaceChildren();
  const value = document.createElement("b");
  value.textContent = `${n} sample${n === 1 ? "" : "s"}`;
  const detail = document.createElement("div");
  detail.textContent = `${label} · ${grading} ${context} · ${model}`;
  tooltip.append(value, detail);
  const box = rect.getBoundingClientRect();
  const x = event ? event.clientX + 14 : box.right + 10;
  const y = event ? event.clientY + 14 : box.top;
  tooltip.style.left = `${Math.min(x, window.innerWidth - 280)}px`;
  tooltip.style.top = `${y}px`;
  tooltip.style.opacity = 1;
}
const hideTooltip = () => { tooltip.style.opacity = 0; };

function block(title, text, open = false) {
  const details = document.createElement("details");
  if (open) details.open = true;
  const summary = document.createElement("summary");
  summary.textContent = title;
  const pre = document.createElement("pre");
  pre.textContent = text;
  details.append(summary, pre);
  return details;
}

function card(sample) {
  const node = document.createElement("article");
  node.className = "card";

  const header = document.createElement("header");
  const title = document.createElement("h3");
  title.textContent = `${sample.grading} · ${sample.context} · epoch ${sample.epoch}`;
  const meta = document.createElement("span");
  meta.className = "meta";
  meta.textContent = sample.model;
  header.append(title);
  // One badge per scorer, in the order the task ran them.
  sample.scores.forEach(score => {
    const badge = document.createElement("span");
    const passed = score.value === "C";
    badge.className = `badge ${passed ? "pass" : "fail"}`;
    badge.textContent = `${score.scorer}: ${passed ? "pass" : "fail"}`;
    header.append(badge);
  });
  header.append(meta);
  node.append(header);

  // The task's evidence function decides what to show, including when there
  // is nothing; with no evidence the scorers' own output is opened instead.
  sample.evidence.forEach((b, i) => node.append(block(b.title, b.text, i === 0)));
  const open = !sample.evidence.length;
  sample.scores.forEach(score => {
    if (score.explanation) node.append(block(`${score.scorer}: explanation`, score.explanation, open));
  });

  for (const [name, result] of Object.entries(sample.scanners)) {
    const value = result.value;
    let verdict, heading;
    if (Array.isArray(value)) {                    // multi-label
      verdict = value.join("\n");
      heading = `${value.length} label(s)`;
    } else if (value && typeof value === "object") {  // structured answer
      verdict = Object.entries(value).map(([k, v]) => `${k}: ${v}`).join("\n");
      heading = Object.entries(value).map(([k, v]) => `${k}=${v}`).join(", ");
    } else {
      verdict = String(value);
      heading = verdict;
    }
    node.append(block(`scanner: ${name} — ${heading}`,
      result.explanation ? `${verdict}\n\n${result.explanation}` : verdict));
  }
  return node;
}

const detail = document.getElementById("detail");
function select(rect) {
  document.querySelectorAll(".seg").forEach(s => s.dataset.selected = String(s === rect));
  const [model, grading, context, band] = JSON.parse(rect.dataset.cell);
  const samples = cellSamples(model, grading, context, band);
  const label = BANDS.find(b => b.key === band).label;

  detail.replaceChildren();
  const heading = document.createElement("h2");
  heading.textContent = `${model} · ${grading} · ${context} — ${label} (${samples.length})`;
  detail.append(heading);
  samples.forEach(s => detail.append(card(s)));
}

function drawLegend() {
  const legend = document.getElementById("legend");
  legend.replaceChildren();
  BANDS.forEach((band, i) => {
    const item = document.createElement("span");
    const swatch = document.createElement("i");
    swatch.className = "swatch";
    swatch.style.background = bandColour(i);
    const text = document.createElement("span");
    text.textContent = band.label;
    item.append(swatch, text);
    legend.append(item);
  });
}

const tableView = document.getElementById("table-view");
function drawTable() {
  const table = document.createElement("table");
  const head = document.createElement("tr");
  ["model", "grading", "context", ...BANDS.map(b => b.label)].forEach(h => {
    const th = document.createElement("th");
    th.textContent = h;
    head.append(th);
  });
  table.append(head);
  MODELS.forEach(model => GRADINGS.forEach(grading => CONTEXTS.forEach(context => {
    const row = document.createElement("tr");
    [model, grading, context].forEach(v => {
      const td = document.createElement("td");
      td.textContent = v;
      row.append(td);
    });
    BANDS.forEach(band => {
      const td = document.createElement("td");
      td.className = "num";
      td.textContent = String(cellSamples(model, grading, context, band.key).length);
      row.append(td);
    });
    table.append(row);
  })));
  tableView.replaceChildren(table);
}

// Everything that depends on the chart, redrawn when the switcher changes it.
function render() {
  document.getElementById("title").textContent = CHART.title;
  document.getElementById("subtitle").textContent =
    `${CHART.subtitle} Click a segment for the samples behind it.`;
  document.querySelectorAll("#switcher button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.chart === CHART.key)));

  const panels = document.getElementById("panels");
  panels.replaceChildren(...MODELS.map(drawPanel));
  panels.querySelectorAll(".seg").forEach(rect => {
    rect.addEventListener("pointermove", e => showTooltip(rect, e));
    rect.addEventListener("pointerleave", hideTooltip);
    rect.addEventListener("focus", () => showTooltip(rect));
    rect.addEventListener("blur", hideTooltip);
    rect.addEventListener("click", () => select(rect));
    rect.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(rect); }
    });
  });

  drawLegend();
  drawTable();
  detail.replaceChildren();
  const hint = document.createElement("p");
  hint.className = "hint";
  hint.textContent = "Select a bar segment to see its samples.";
  detail.append(hint);
}

const switcher = document.getElementById("switcher");
DATA.charts.forEach(chart => {
  const button = document.createElement("button");
  button.textContent = chart.title;
  button.dataset.chart = chart.key;
  button.addEventListener("click", () => {
    CHART = chart;
    BANDS = chart.bands;
    render();
  });
  switcher.append(button);
});
render();

const toggle = document.getElementById("toggle-table");
toggle.addEventListener("click", () => {
  const shown = !tableView.hidden;
  tableView.hidden = shown;
  toggle.textContent = shown ? "Show table" : "Hide table";
  toggle.setAttribute("aria-expanded", String(!shown));
});
</script>
</body>
</html>
